<style>

{display:block;min-width:960px;width:100%;height:auto}.figure-caption{font-size:12px;line-height:1.7;color:var(--muted);margin:10px 0 24px}.flow-node{cursor:pointer}.flow-node rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.flow-node.active rect,.flow-node:hover rect{stroke:var(--accent);fill:var(--tint)}.flow-node text{fill:var(--ink);font-family:var(--sans)}.flow-detail{border-top:1px solid var(--line);padding:16px 0;min-height:80px}.compare{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0}.compare>div{padding:22px 24px 22px 0}.compare>div+div{border-left:1px solid var(--line);padding-left:24px}.compare h3{margin:0 0 8px}.compare p{font-size:14px;color:var(--muted);margin:0}details{border-top:1px solid var(--line);padding:18px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--muted);font-size:15px}.sources{list-style:none;padding:0;margin:0}.sources li{border-bottom:1px solid var(--line);padding:12px 0}.sources a{display:block;text-decoration:none;font-size:14px}.sources small{color:var(--soft);font:10px var(--mono);word-break:break-word}.learning-controls{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.learning-controls button{font-size:13px}.notes{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:14px;background:var(--panel);color:var(--ink);font-size:14px}.prompt{font-size:14px;white-space:pre-wrap;line-height:1.7;border-left:2px solid var(--line);padding-left:18px}.topic-end{margin-top:48px;border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;gap:20px}.topic-end a{text-decoration:none;font-size:13px}.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);margin:15px 0 8px}.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 28px}.filterbar button{font-size:12px;padding:6px 12px}.filterbar button.on{background:var(--ink);color:white}.results{padding:0;list-style:none}.result{padding:22px 0;border-bottom:1px solid var(--line)}.result a{text-decoration:none;font-size:19px;color:var(--ink)}.result a:hover{color:var(--accent)}.result .snippet{font-size:13px;color:var(--muted);margin:8px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.result .eyebrow{font-size:10px;margin-bottom:6px}.document{max-width:850px}.document h1{font-size:44px}.document h2{scroll-margin-top:25px}.document h3,.document h4{scroll-margin-top:25px}.document p,.document li{font-size:15px;line-height:1.8}.document table{border-collapse:collapse;font-size:13px;min-width:500px;width:100%}.document th,.document td{border:1px solid var(--line);padding:10px 12px;vertical-align:top;text-align:left}.document th{background:#eaeaec}.table-wrap{overflow-x:auto;margin:20px 0}.document pre{padding:18px;background:#e9e9ec;border-radius:6px;overflow:auto;font:12px/1.7 var(--mono)}.document code{font-family:var(--mono);font-size:.85em;overflow-wrap:anywhere}.document blockquote{border-left:3px solid var(--line);margin-left:0;padding-left:20px;color:var(--muted)}.document hr{border:0;border-top:1px solid var(--line);margin:32px 0}.doc-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;margin-bottom:20px}.doc-meta{font:10px/1.7 var(--mono);color:var(--soft);overflow-wrap:anywhere}.toc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:15px 20px;margin:24px 0}.toc a{display:block;color:var(--muted);font-size:12px;line-height:1.7;text-decoration:none;padding:3px 0}.status-note{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:36px;font-size:12px;color:var(--soft)}.saved-item{padding:22px 0;border-bottom:1px solid var(--line)}.saved-item p{white-space:pre-wrap;font-size:14px;color:var(--muted)}.empty{padding:36px 0;color:var(--muted)}.badge{font:10px var(--mono);padding:4px 7px;background:var(--tint);color:var(--accent);border-radius:4px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:6px;background:var(--ink);color:white;font-size:13px;z-index:20}.hidden{display:none!important}@media(min-width:1500px){main{padding-left:100px;padding-right:100px}}@media(max-width:850px){.shell{grid-template-columns:1fr}.rail{position:relative;height:auto;padding:18px 22px;border-right:0;border-bottom:1px solid var(--line)}.rail nav{display:flex;overflow-x:auto;gap:4px}.rail nav a{white-space:nowrap;flex-shrink:0}.rail nav a:not(.utility){max-width:210px}.rail .eyebrow,.rail-bottom{display:none}.brand{margin-bottom:12px}.topbar{margin-bottom:28px}.map{grid-template-columns:1fr}.topic-card:nth-child(odd){border-right:0}.topic-card:nth-child(even){padding-left:0}main{padding:25px 22px 70px}h1{font-size:42px}.lede{font-size:18px}}@media(max-width:520px){.compare{grid-template-columns:1fr}.compare>div+div{border-left:0;border-top:1px solid var(--line);padding-left:0}.topbar .eyebrow{max-width:150px}.panel{padding:20px}.document h1{font-size:34px}.topic-end{flex-direction:column}}@media print{.rail,.topbar,.learning-controls,.topic-end,.notes,.filterbar{display:none}.shell{display:block}main{padding:0}.figure-wrap svg{min-width:0}.document pre{white-space:pre-wrap}.panel{break-inside:avoid}}

</style></head><body>
<div class="shell"><aside class="rail"><a href="#home" class="brand">NBRET<span> / </span>Research</a><div class="eyebrow">Read & explore</div><nav id="topic-nav" aria-label="Learning topics"></nav><div class="eyebrow">Your workspace</div><nav aria-label="Reader tools"><a class="utility" href="#home">Research overview</a><a class="utility" href="#library">Research library</a><a class="utility" href="#notebook">My notes & questions</a><a class="utility" href="#context">Continue learning</a></nav><div class="rail-bottom">A learning edition of active research.<br><span id="build-date"></span><br>Source reads and local tests answer different questions.</div></aside><main><div class="wrap"><div class="topbar"><a href="#home">Inside cybersecurity</a><button id="resume">Resume learning →</button></div><div id="content" tabindex="-1"></div></div></main></div><div id="toast" role="status" class="toast hidden"></div>
<!-- RESEARCH_DATA -->
<script>
'use strict';
const DATA=JSON.parse(document.querySelector('#research-data').textContent);
const TOPICS=DATA.topics, DOCS=new Map(DATA.docs.map(d=>[d.path,d]));
const TRACKS={'security-landscape':'Assessments & engines','toolchain':'Tools & connectivity','bots-swarms':'Bots & coordination','assessment-evidence':'Evidence & AI agents','cybersecurity-firms':'Companies & services','background':'Earlier REA research'};
const STORE='nbret-learning-v1';let state={last:'01',notes:{},reviewed:{},bookmarks:[]};
try{state={...state,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch{toast('Browser storage unavailable. Export your notes to keep them.')}}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function docHref(p,a=''){return '#doc='+encodeURIComponent(p)+(a?'&anchor='+encodeURIComponent(a):'')}
function title(p){return DOCS.get(p)?.title||p.split('/').pop()}
function sourceList(paths){return '<ul class="sources">'+paths.map(p=>'<li><a href="'+esc(docHref(p))+'">'+esc(title(p))+'</a><small>'+esc(p)+'</small></li>').join('')+'</ul>'}
function nav(){ $('#topic-nav').innerHTML=TOPICS.map(t=>'<a href="#topic='+t.id+'" data-topic="'+t.id+'"><span>'+t.id+'</span><span>'+esc(t.title)+'</span></a>').join(''); $('#build-date').textContent='Snapshot '+new Date(DATA.generated).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function go(id){location.hash='topic='+id}
$('#resume').onclick=()=>go(state.last||'01');
function topic(t){const i=TOPICS.indexOf(t);return '<div class="eyebrow">Topic '+t.id+' / '+esc(t.group)+'</div><h1>'+esc(t.title)+'</h1><p class="lede">'+esc(t.idea)+'</p><div class="section-label"><h2>Let’s walk through it</h2><span class="small">'+esc(t.question)+'</span></div>'+diagram(t)+'<div class="reading">'+t.explain.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div><div class="compare"><div><div class="eyebrow">Distinguish</div><h3>'+esc(t.contrast.a)+'</h3><p>'+esc(t.contrast.left)+'</p></div><div><div class="eyebrow">From</div><h3>'+esc(t.contrast.b)+'</h3><p>'+esc(t.contrast.right)+'</p></div></div><details><summary>Go deeper: canonical explanations and evidence</summary><p>Open any article without leaving the reader. Detailed source ranges, experiments, corrections and limits remain in the original study.</p>'+sourceList(t.sources)+'</details><div class="panel"><div class="eyebrow">Pause and recall</div><h3>'+esc(t.recall)+'</h3><details><summary>Compare your explanation</summary><p>'+esc(t.answer)+'</p></details></div><h2>Make the idea yours</h2><p class="small">Write your own explanation or a question for our next conversation. Notes stay in this browser; export a copy for portability.</p><textarea class="notes" id="topic-notes" aria-label="Your notes for topic '+t.id+'" placeholder="In my own words…\nWhat I still want to understand…">'+esc(state.notes[t.id]||'')+'</textarea><div class="learning-controls"><button id="mark-reviewed">'+(state.reviewed[t.id]?'Marked for revisit ✓':'Mark as discussed')+'</button><button id="copy-context">Copy discussion prompt</button><button id="export-notes">Export notes</button></div><details><summary>Discuss this with Rowan</summary><p class="prompt">'+esc(t.ask)+'</p><p class="small">Ask for a concrete example, a prediction exercise, a diagram walkthrough or a challenge to your explanation.</p></details><div class="topic-end">'+(i?'<a href="#topic='+TOPICS[i-1].id+'">← '+esc(TOPICS[i-1].title)+'</a>':'<a href="#home">← Field map</a>')+(i<TOPICS.length-1?'<a href="#topic='+TOPICS[i+1].id+'">Next: '+esc(TOPICS[i+1].title)+' →</a>':'<a href="#notebook">Review your questions →</a>')+'</div>'}
function bindTopic(t){$('#topic-notes').oninput=e=>{state.notes[t.id]=e.target.value;save()};$('#mark-reviewed').onclick=()=>{state.reviewed[t.id]=!state.reviewed[t.id];save();$('#mark-reviewed').textContent=state.reviewed[t.id]?'Marked for revisit ✓':'Mark as discussed'};$('#copy-context').onclick=()=>copy(contextText(t));$('#export-notes').onclick=exportNotes;}
function contextText(t){return 'NBRET learning reader · Topic '+t.id+' — '+t.title+'\nSnapshot: '+DATA.generated+'\n\n'+t.ask+'\n\nMy notes/questions:\n'+(state.notes[t.id]||'(none yet)')+'\n\nCanonical study paths (under docs/research/):\n'+t.sources.join('\n')+'\n\nPlease distinguish source-established behavior, runtime validation, hypotheses and corrected claims. Build from the existing research rather than repeating the overview.'}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Discussion prompt copied')}catch{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.left='-10000px';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'Discussion prompt copied':'Copy unavailable. Select the discussion prompt manually.')}}
function exportNotes(){const content={exported:new Date().toISOString(),snapshot:DATA.generated,...state};const u=URL.createObjectURL(new Blob([JSON.stringify(content,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='nbret-learning-notes-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function library(){return '<div class="eyebrow">Search the underlying research</div><h1>The research library</h1><p class="lede">Find the mechanism, source trace or evidence behind an explanation. Articles are snapshots of active work.</p><label for="search" class="small">Search titles, paths and full document text</label><input class="search" id="search" type="search" placeholder="Try: cancellation, CrowdStrike, proxy, evidence…"><div class="filterbar" id="filters"><button data-filter="" class="on">All studies</button>'+Object.entries(TRACKS).map(([k,v])=>'<button data-filter="'+k+'">'+v+'</button>').join('')+'</div><div class="small" id="result-count" role="status"></div><ul class="results" id="results"></ul>'}
function bindLibrary(){let filter='';function run(){const q=$('#search').value.trim().toLowerCase();const terms=q.split(/\s+/).filter(Boolean);const matches=DATA.docs.filter(d=>(!filter||(filter==='background'?!d.path.includes('/'):d.path.startsWith(filter+'/')))&&terms.every(s=>(d.title+' '+d.path+' '+d.text).toLowerCase().includes(s)));$('#result-count').textContent=matches.length+' articles'+(matches.length>60?' · showing the first 60; refine your search':'');$('#results').innerHTML=matches.slice(0,60).map(d=>{let pos=q?d.text.toLowerCase().indexOf(terms[0]):0;pos=Math.max(0,pos-70);const snippet=d.text.slice(pos,pos+280).replace(/[#|`*]/g,' ').replace(/\s+/g,' ');return '<li class="result"><div class="eyebrow">'+esc(TRACKS[d.path.split('/')[0]]||'Earlier REA research')+'</div><a href="'+docHref(d.path)+'">'+esc(d.title)+'</a><p class="snippet">'+esc(snippet)+'</p><div class="doc-meta">'+esc(d.path)+'</div></li>'}).join('')};$('#search').oninput=run;$('#filters').onclick=e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));run()};run()}
function normalize(p){const out=[];for(const x of p.replaceAll('\\','/').split('/')){if(x==='..')out.pop();else if(x&&x!=='.')out.push(x)}return out.join('/')}
function linkTarget(url,current){let decoded=url.trim().replace(/^<|>$/g,'');try{decoded=decodeURI(decoded)}catch{};if(/^https?:\/\//i.test(decoded))return {url:decoded,external:true};if(decoded.startsWith('#'))return {url:docHref(current,decoded.slice(1))};if(/^[a-z][a-z\d+.-]*:/i.test(decoded)&&!/^C:\//i.test(decoded))return null;let [p,...hash]=decoded.split('#');p=normalize(current.split('/').slice(0,-1).join('/')+'/'+p);if(DOCS.has(p))return {url:docHref(p,hash.join('#'))};if(p.startsWith('C:')||p.includes(':')||p.startsWith('/'))return null;return {url:'../'+p+(hash.length?'#'+hash.join('#'):''),raw:true}}
function inline(s,current){let tokens=[];const hold=h=>'\u0001'+(tokens.push(h)-1)+'\u0002';s=s.replace(/`([^`]+)`/g,(_,v)=>hold('<code>'+esc(v)+'</code>'));s=s.replace(/\[([^\]]+)\]\((<[^>]+>|[^)]+)\)/g,(_,label,url)=>{const target=linkTarget(url,current);return hold(target?'<a href="'+esc(target.url)+'"'+(target.external?' target="_blank" rel="noopener noreferrer"':'')+'>'+esc(label)+'</a>':esc(label))});s=esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g,'<em>$1</em>');return s.replace(/\u0001(\d+)\u0002/g,(_,i)=>tokens[Number(i)])}
function slug(s){return s.toLowerCase().replace(/<[^>]*>/g,'').replace(/[^\p{L}\p{N}\s_-]/gu,'').replace(/\s/g,'-')}
function markdown(text,current){const lines=text.split(/\r?\n/);let html=[],toc=[],used={};for(let i=0;i<lines.length;){let s=lines[i];if(!s.trim()){i++;continue}if(/^\s*```/.test(s)){const b=[];i++;while(i<lines.length&&!/^\s*```/.test(lines[i]))b.push(lines[i++]);i++;html.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue}let h=s.match(/^(#{1,6})\s+(.+)$/);if(h){const base=slug(h[2]);const n=used[base]||0;used[base]=n+1;const id=base+(n?'-'+n:'');html.push('<h'+h[1].length+' id="'+esc(id)+'">'+inline(h[2],current)+'</h'+h[1].length+'>');if(h[1].length===2)toc.push({id,text:h[2]});i++;continue}if(/^\s*\|/.test(s)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|/.test(lines[i+1])){const rows=[];const cells=v=>v.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(x=>x.trim());rows.push('<thead><tr>'+cells(s).map(c=>'<th>'+inline(c,current)+'</th>').join('')+'</tr></thead><tbody>');i+=2;while(i<lines.length&&/^\s*\|/.test(lines[i]))rows.push('<tr>'+cells(lines[i++]).map(c=>'<td>'+inline(c,current)+'</td>').join('')+'</tr>');html.push('<div class="table-wrap"><table>'+rows.join('')+'</tbody></table></div>');continue}if(/^\s*([-*_])\1{2,}\s*$/.test(s)){html.push('<hr>');i++;continue}if(/^\s*>/.test(s)){const b=[];while(i<lines.length&&/^\s*>/.test(lines[i]))b.push(lines[i++].replace(/^\s*>\s?/,''));html.push('<blockquote>'+inline(b.join(' '),current)+'</blockquote>');continue}if(/^\s*(?:[-*+] |\d+\. )/.test(s)){const ordered=/^\s*\d+\./.test(s),tag=ordered?'ol':'ul';const items=[];while(i<lines.length&&/^\s*(?:[-*+] |\d+\. )/.test(lines[i]))items.push('<li>'+inline(lines[i++].replace(/^\s*(?:[-*+] |\d+\. )/,''),current)+'</li>');html.push('<'+tag+'>'+items.join('')+'</'+tag+'>');continue}const b=[s];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,6}\s|\s*```|\s*\||\s*[-*+] |\s*\d+\. |\s*>)/.test(lines[i]))b.push(lines[i++]);html.push('<p>'+inline(b.join(' '),current)+'</p>')}return {html:html.join('\n'),toc}}
function documentPage(p,anchor){const d=DOCS.get(p);if(!d)return '<h1>Article not in this snapshot</h1><p>The research may have moved or been added after the build.</p><a href="#library">Search the library</a>';const md=markdown(d.text,p);const toc=md.toc.length?'<details class="toc"><summary>In this article · '+md.toc.length+' sections</summary>'+md.toc.map(t=>'<a href="'+docHref(p,t.id)+'">'+esc(t.text)+'</a>').join('')+'</details>':'';return '<div class="doc-toolbar"><a href="#library">← Research library</a><button id="bookmark-doc">'+(state.bookmarks.includes(p)?'Saved ✓':'Save article')+'</button><button id="copy-doc">Copy discussion context</button><a href="../'+esc(p)+'" target="_blank" rel="noopener">Original Markdown ↗</a></div><div class="doc-meta">'+esc(p)+'<br>Snapshot '+esc(DATA.generated)+' · SHA-256 '+esc(d.sha256.slice(0,20))+'…</div>'+toc+'<article class="document">'+md.html+'</article><div class="status-note">Evidence labels and limitations belong to this canonical article. A successful build or matching hash does not independently validate its conclusions.</div>'}
function notebook(){const notes=TOPICS.filter(t=>state.notes[t.id]||state.reviewed[t.id]);return '<div class="eyebrow">Your learning workspace</div><h1>Notes & open questions</h1><p class="lede">Keep your own explanations here. Marking a topic as discussed records a visit, not mastery.</p><div class="learning-controls"><button id="export-all">Export notes</button><label class="small">Restore exported notes <input type="file" id="import-notes" accept="application/json"></label></div>'+(!notes.length?'<p class="empty">No topic notes yet. Open a topic and write a question or explain it in your own words.</p>':notes.map(t=>'<section class="saved-item"><div class="eyebrow">Topic '+t.id+(state.reviewed[t.id]?' · discussed':'')+'</div><h3><a href="#topic='+t.id+'">'+esc(t.title)+'</a></h3><p>'+esc(state.notes[t.id]||'No written notes yet.')+'</p><button data-copy-topic="'+t.id+'">Copy discussion context</button></section>').join(''))+'<h2>Saved articles</h2>'+sourceList(state.bookmarks.filter(p=>DOCS.has(p)))+'<p class="small">Stored locally in this browser profile. Export a copy to transfer notes to another browser or keep a backup.</p>'}
function contextPage(){return '<div class="eyebrow">A shared vocabulary for future conversations</div><h1>Pick up the thread.</h1><p class="lede">You do not need to remember the file tree. Refer to a topic number, a question or a saved article, and we can go deeper from there.</p><div class="panel"><h3>A useful way to ask</h3><p class="prompt">“Topic 05: I understand leases, but I don’t understand why cancellation isn’t enough. Give me a concrete example, then ask me to explain it back.”</p></div><h2>Three ways to learn</h2><details open><summary>Build a mental model</summary><p>Ask for a diagram walkthrough, one concrete example, and the assumptions that make the example work. Connect the idea to a neighboring topic.</p></details><details><summary>Stress-test your understanding</summary><p>Predict what happens before reading the answer. Explain the mechanism in your own words. Ask Rowan to identify the precise mistake or missing boundary, rather than repeating the whole lesson.</p></details><details><summary>Follow the evidence</summary><p>Open a canonical article, copy its discussion context, and ask what source behavior, runtime evidence, contrary evidence and unknowns support a particular claim.</p></details><h2>What persists, and what does not</h2><p>This HTML embeds a dated snapshot of the canonical Markdown studies. Rebuild it as the research changes. Notes and discussed markers are saved in this browser and can be exported. A new chat does not automatically know your private browser notes: use “Copy discussion prompt” to carry them across.</p><p>The project’s durable orientation is <code>docs/research/learning/CONTEXT.md</code>. Ask future sessions to read it and the canonical topic sources before continuing.</p><a class="primary" href="#topic=01">Start with the first question →</a>'}
function baseRoute(){const raw=location.hash.slice(1);const params=new URLSearchParams(raw);const t=TOPICS.find(x=>x.id===params.get('topic'));const doc=params.get('doc');document.querySelectorAll('[data-topic]').forEach(a=>a.classList.toggle('active',a.dataset.topic===t?.id));if(t){state.last=t.id;save();$('#content').innerHTML=topic(t);bindTopic(t);document.title=t.id+' · '+t.title+' — NBRET'}else if(doc){$('#content').innerHTML=documentPage(doc,params.get('anchor'));document.title=title(doc)+' — NBRET';if(DOCS.has(doc)){$('#bookmark-doc').onclick=()=>{const i=state.bookmarks.indexOf(doc);if(i<0)state.bookmarks.push(doc);else state.bookmarks.splice(i,1);save();$('#bookmark-doc').textContent=state.bookmarks.includes(doc)?'Saved ✓':'Save article'};$('#copy-doc').onclick=()=>copy('NBRET research discussion\nArticle: docs/research/'+doc+'\nSnapshot: '+DATA.generated+'\nSHA-256: '+DOCS.get(doc).sha256+'\n\nExplain the mechanism and evidence in this article. Separate source findings, runtime validation, hypotheses, corrections and remaining unknowns. Ask what I want to explore before repeating the overview.')}}else if(raw==='reading-plan'){$('#content').innerHTML=home();requestAnimationFrame(()=>document.getElementById('reading-plan').scrollIntoView());document.title='Your reading path — NBRET'}else if(raw==='library'){$('#content').innerHTML=library();bindLibrary();document.title='Research library — NBRET'}else if(raw==='notebook'){$('#content').innerHTML=notebook();$('#export-all').onclick=exportNotes;document.querySelectorAll('[data-copy-topic]').forEach(b=>b.onclick=()=>copy(contextText(TOPICS.find(t=>t.id===b.dataset.copyTopic))));$('#import-notes').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('File too large');const s=JSON.parse(await f.text());if(!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes))throw Error('Not a notes export');for(const t of TOPICS){if(typeof s.notes[t.id]==='string')state.notes[t.id]=s.notes[t.id];if(typeof s.reviewed?.[t.id]==='boolean')state.reviewed[t.id]=s.reviewed[t.id]}if(Array.isArray(s.bookmarks))state.bookmarks=[...new Set([...state.bookmarks,...s.bookmarks.filter(p=>typeof p==='string'&&DOCS.has(p))])];save();route();toast('Notes restored')}catch(err){toast('Could not import notes: '+err.message)}}}else if(raw==='context'){$('#content').innerHTML=contextPage();document.title='Continue learning — NBRET'}else{$('#content').innerHTML=home();document.title='Inside cybersecurity · NBRET'}mountVisuals();window.scrollTo(0,0);if(doc&&params.get('anchor')){requestAnimationFrame(()=>{const el=document.getElementById(params.get('anchor'));if(el)el.scrollIntoView();else toast('Section anchor not found; the full article is open.')})}}
