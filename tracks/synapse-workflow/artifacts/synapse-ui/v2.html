function searchRows(){let ids=cases.map((_,i)=>i).filter(i=>cases[i].title.toLowerCase().includes(query.toLowerCase()));return ids.length?ids.map(i=>row(i,true)).join(''):'<div class="empty-search">No matching consequences</div>'}
function board(){if(detail)return `<div class="body"><button class="back" id="back">← Overview</button><article class="inspector" style="padding:0;max-width:950px;margin:auto">${caseContent()}</article></div>`;return `<div class="body"><div class="head"><div><h1>Overview</h1><p>Northstar Portal <span style="color:#c4ccda">&nbsp; / &nbsp;</span> 18 October</p></div><div class="seg">${['All','Needs action','Unconfirmed'].map(s=>`<button data-filter="${s}" class="${filter===s?'on':''}">${s}</button>`).join('')}</div></div><div class="stats"><div class="stat"><div><b>1</b><span>Needs your verification</span></div><div class="orb">↗</div></div><div class="stat"><div><b>1</b><span>Unconfirmed lead</span></div><div class="orb">◌</div></div><div class="stat"><div><b>0</b><span>Independently verified</span></div><div class="orb">✓</div></div></div><div class="overview-grid"><section class="borderbox"><div class="boxhead"><h3>Consequences</h3><small>Priority order</small></div><div class="issue-list">${(filter==='All'?[0,1]:filter==='Needs action'?[0]:[1]).map(n=>row(n)).join('')}</div><div style="padding:20px;border-top:1px solid #edf0f5"><small>Repair focus</small><p style="font-size:12px;margin-top:8px;color:#657793">Check invoice ownership on every access route.</p><div style="display:flex;gap:7px;margin-top:14px"><span class="chip blue">Server authorization</span><span class="chip">Moderate effort</span></div></div></section><section class="borderbox"><div class="boxhead"><h3>Invoice exposure</h3><span class="chip orange">Sample observed</span></div><div class="path">${nodes()}<p>A customer account can retrieve another company’s invoice.</p><button class="soft" data-case="0">View evidence &nbsp; ↗</button></div></section></div><div class="bottomgrid"><section class="borderbox"><div class="boxhead"><h3>Investigate next</h3><small>2 questions</small></div><div class="next-list"><div class="next-item"><span class="num">01</span><div><b>Does invoice export share the same gap?</b><p>Extend the demonstrated exposure.</p></div></div><div class="next-item"><span class="num">02</span><div><b>Which collaborators should retain access?</b><p>Resolve the repair’s sharing rule.</p></div></div></div></section><section class="borderbox"><div class="boxhead"><h3>Investigation scope</h3><button class="muted" id="scope2">↗</button></div><div class="coverage"><div class="ring"></div><div class="legend"><div><i></i>4 workflows examined</div><div><i></i>3 workflows remain open</div><small>Example activity, not a security score</small></div></div></section></div><div class="mini-footer"><span>Last saved just now</span><span>Fictional assessment sample</span></div></div>`}
function film(){return `<div class="body"><div class="head"><div><h1>Evidence</h1><p>Two consequences. Follow each path.</p></div><span class="chip blue">Review mode</span></div><div class="filmgrid"><div class="tiles">${cases.map((c,n)=>`<button class="tile ${selected===n?'selected':''}" data-case="${n}"><div class="thumb"><div class="tiny"><div></div><div></div><div></div></div><span style="color:#b8c8e4">${n?'⟳':'→'}</span><div class="tiny"><div></div><div></div><div></div></div></div><b>${c.title}</b><span class="chip ${n?'gray':'orange'}">${c.status}</span></button>`).join('')}<div class="mini-note">Illustrative screens, not captured evidence.</div></div><article class="film-stage">${caseContent()}</article></div></div>`}
function caseContent(){let c=cases[selected];return `<div class="case-title"><small>Case 0${selected+1}</small><span class="chip ${selected?'gray':'orange'}">${c.status}</span></div><h1>${c.title}</h1><div class="case-meta"><span class="chip blue">${selected?'Order approval':'Customer data'}</span><span class="chip">${c.label}</span><span class="chip">${selected?'Review pending':'Customer access'}</span></div><p class="case-desc">${c.why}</p><div class="detailtabs">${[['evidence','Evidence'],['repair','Proposed repair'],['technical','Technical']].map(([k,v])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}</div>${selected?`<div class="blank"><div style="font-size:28px;color:#a4b8da;margin-bottom:15px">◌</div><h3>Still an open question</h3><p>Compare the edited order with its approved revision.<br>No effect or repair has been established.</p></div>`:tab==='evidence'?evidenceContent():tab==='repair'?repairContent():technicalContent()}`}
function nodes(){return `<div class="nodes"><div class="node"><span class="node-icon">♙</span><b>Customer</b></div><div class="connector"></div><div class="node"><span class="node-icon">⇄</span><b>Invoice request</b></div><div class="connector"></div><div class="node"><span class="node-icon">▧</span><b>Other company</b></div></div>`}
function screenshot(){return `<div class="evidence"><div class="evidence-chrome"><i></i><i></i><i></i><span>Northstar Portal / Billing</span></div><div class="capture-app"><div class="capture-side"><b>Northstar</b><div>Overview</div><div>Orders</div><div class="chosen">Invoices</div><div>Settings</div></div><div class="capture-main"><div class="capture-title"><span>Invoice details</span><span>Alex · North</span></div><div class="invoice-card"><div class="company ${step===1?'annotated':''}"><span>${step===0?'North Company':step===1?'South Company':'Access restricted'}</span><span>${step===2?'Proposed state':'Invoice'}</span></div><h3>${step===2?'You don’t have access':step===0?'INV-N014':'INV-S021'}</h3><div class="invoice-line"><span>${step===2?'Result':'Billing contact'}</span><span>${step===2?'No protected data returned':'Accounts team'}</span></div><div class="invoice-line"><span>${step===2?'Your invoices':'Total due'}</span><span>${step===2?'Still available':'$2,400.00'}</span></div></div></div></div><div class="frame-caption"><span>${step===2?'Proposed outcome · not retested':'Illustrative screen recreation'}</span><button id="zoom">Expand ⤢</button></div></div>`}
function evidenceContent(){return `${screenshot()}<div class="step-controls"><span class="step-caption">${['1 · Legitimate owner access','2 · Another company’s invoice returned','3 · Proposed repaired behavior'][step]}</span><div>${[0,1,2].map(n=>`<button data-step="${n}" class="${step===n?'on':''}" aria-label="Step ${n+1}">${n+1}</button>`).join('')}</div></div><div class="factsrow"><div><small>Consequence</small><b>Billing details exposed</b></div><div><small>Observed sample</small><b>2 records</b></div><div><small>Wider reach</small><b>Not established</b></div></div>${layout==='film'?`<div class="floating"><button data-step="0" class="${step===0?'on':''}">Owner access</button><button data-step="1" class="${step===1?'on':''}">Exposure</button><button data-step="2" class="${step===2?'on':''}">Proposed fix</button></div>`:''}`}
function repairContent(){return `<div class="compare"><div class="fix"><span class="chip">Current</span><h3 style="margin-top:14px">Login checked</h3><p>Any signed-in customer can request the invoice.</p></div><div class="fix"><span class="chip blue">Proposed</span><h3 style="margin-top:14px">Invoice access checked</h3><p>Only the owner or an approved collaborator receives it.</p></div></div><div class="fix" style="margin-top:17px"><h3>Centralize the access check</h3><p>Apply the same organization and sharing rule to invoice details, downloads and exports.</p><ul><li>Block cross-company reads without returning protected fields.</li><li>Keep owner and approved collaborator access working.</li><li>Retest the original and related routes on the changed build.</li></ul></div><div class="factsrow"><div><small>Effort</small><b>Moderate · estimate</b></div><div><small>Open question</small><b>Collaborator permissions</b></div><div><small>Retest</small><b>Awaiting repair</b></div></div>`}
function technicalContent(){return `<div class="fix"><h3>Authorization boundary</h3><p>Derive the caller’s organization from trusted session state. Check the requested invoice against the authorized ownership and collaboration rules.</p><div class="code">Caller: Alex / North / customer\nObserved record: South / INV-S021\nExpected: no protected fields returned\n\nAcceptance\n✓ Owner access remains available\n✓ Cross-company request denied\n✓ Approved sharing preserved\n✓ Detail / export / download checked</div></div><div class="mini-note">Fictional case. Engineering location requires source inspection.</div>`}
function sectionPage(){if(section==='Evidence')return `<div class="section-page"><h1>Evidence library</h1><div class="borderbox">${[0,1,2].map(n=>`<button class="issue-row" data-evidence="${n}"><span class="issue-icon">▧</span><div class="issue-text"><b>${['Owner invoice','Cross-company invoice','Proposed repaired outcome'][n]}</b><small>${n===2?'Proposal · not a retest':'Illustrative screen · not captured evidence'}</small></div><span>↗</span></button>`).join('')}</div></div>`;if(section==='Repairs')return `<div class="section-page"><h1>Repairs</h1>${repairContent()}</div>`;return `<div class="section-page"><h1>Scope & unknowns</h1><div class="borderbox"><div class="boxhead"><h3>Northstar Portal</h3><span class="chip">Fictional sample</span></div><div class="coverage"><div class="ring"></div><div class="legend"><div>4 workflows examined</div><div>3 remain open</div><div>Independent verification not established</div></div></div></div><div class="fix" style="margin-top:18px"><h3>Pending questions</h3><ul><li>Extent across export and download routes</li><li>Approved collaborator access rules</li><li>Behavior after an actual repair</li></ul></div></div>`}
function openDialog(content){let d=document.getElementById('dialog');d.innerHTML=content;d.showModal();d.querySelector('[data-close]').onclick=()=>d.close();let z=d.querySelector('#zoom');if(z)z.remove()}
function refs(){openDialog(`<div class="dialoghead"><h2>Restored from the private R2 library</h2><button class="soft" data-close>Close ×</button></div><div class="ref-grid"><div><img src="/references/0/product.png" alt="Archived Linear issues screen"><h3>Linear · Issues</h3><p>Compact navigation, rows and restrained hierarchy.</p><small>Captured 2 October · actual app</small></div><div><img src="/references/1/product.png" alt="Support analytics dashboard by Maxim Kuznetsov"><h3>Maxim Kuznetsov · Dashboard</h3><p>Soft surfaces, grouped controls and compact modules.</p><a href="https://x.com/disarto_max/status/2103897094671020203" target="_blank" rel="noopener">Original source ↗</a></div><div><img src="/references/2/frame0.png" alt="Saved Split View component reference"><h3>Split View</h3><p>Paired visual panels and focused comparison.</p><small>Archived 13 October · saved component</small></div></div><p class="mini-note">Source manifests and downloaded bytes retained locally; SHA-256 verified. Reference images are design sources, not assessment evidence.</p>`)}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;detail=false;render()});document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=+b.dataset.case;tab='evidence';step=1;detail=true;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>{selected=0;step=+b.dataset.evidence;tab='evidence';section='Consequences';detail=true;render()});let q=document.getElementById('search');if(q)q.oninput=()=>{query=q.value;document.getElementById('search-results').innerHTML=searchRows();document.querySelectorAll('#search-results [data-case]').forEach(b=>b.onclick=()=>{selected=+b.dataset.case;render()})};let back=document.getElementById('back');if(back)back.onclick=()=>{detail=false;render()};for(let id of ['scope','scope2']){let b=document.getElementById(id);if(b)b.onclick=()=>{section='Scope';render()}}let z=document.getElementById('zoom');if(z)z.onclick=()=>openDialog(`<div class="dialoghead"><h2>${step===2?'Proposed repaired behavior':'Invoice evidence · illustration'}</h2><button class="soft" data-close>Close ×</button></div><div class="lightbox">${screenshot()}</div>`)}
document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;section='Consequences';detail=false;history.replaceState(null,'','?design='+layout);render()});document.getElementById('refs').onclick=refs;document.getElementById('dialog').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};render();
</script></body></html>
