efing"><div class="chapter"><span class="line"></span><span>${chapters[chapter]}</span></div><div class="stage"><div class="copy"><h1>${data[0]}</h1><p>${data[1]}</p><div class="actions"><button class="primary" id="nextAction">${chapter===0?'See what we found':chapter===4?'Return to the beginning':'Continue'} &nbsp; →</button><button class="textlink" data-modal="${chapter===3?'repair':chapter===0?'scope':'evidence'}">${chapter===3?'Engineering detail':chapter===0?'Assessment scope':'Supporting evidence'} ↗</button></div></div><div class="visual">${data[2]}</div></div><div class="pager"><nav class="chapter-nav">${chapters.map((c,n)=>`<button data-chapter="${n}" class="${chapter===n?'active':''}"><i></i>${c}</button>`).join('')}</nav><div class="page-buttons"><span class="page-count">${chapter+1} / 5</span><button id="prev" aria-label="Previous chapter" ${chapter===0?'disabled':''}>←</button><button id="next" aria-label="Next chapter" ${chapter===4?'disabled':''}>→</button></div></div></section>`}
function comparison(){return `<div class="comparison"><div><span class="label">Current behavior</span><h3>Valid login → invoice returned</h3><p>The customer’s relationship to the invoice is not checked.</p><div class="line-item">Observed in this sample</div></div><div class="after"><span class="label">Synapse recommendation</span><h3>Access rule → allow or deny</h3><p>Only owners and approved collaborators receive the invoice.</p><div class="line-item">Proposed · needs implementation and retest</div></div></div>`}
const nodeContent=[['Starting access','An ordinary customer account','The path begins with a supplied customer identity. Administrator access is not required.','Access level','Customer','scope'],['Underlying cause','The invoice ownership check is missing','A valid login is accepted without checking whether the caller has access to the requested invoice.','Repair focus','Centralize invoice authorization','repair'],['Demonstrated consequence','Another company’s invoice is returned','The example demonstrates disclosure of billing information across a company boundary.','Demonstrated sample','2 invoice records','evidence'],['Unresolved extent','How far does the same gap reach?','The sample does not establish all-customer access. Invoice downloads and exports need their own checks.','Next investigation','Related routes and sharing rules','scope']];
function map(){let d=nodeContent[node];return `<section class="mapbody"><div class="map-heading"><div><h1>How the exposure happens</h1><p>Select a point to inspect the evidence and its limits.</p></div><button class="secondary" data-modal="scope">What we examined ↗</button></div><div class="map-layout"><div><div class="mapcanvas"><div class="mapcanvas-inner"><div class="edge" style="left:20%;top:202px;width:32%"></div><div class="edge" style="left:52%;top:202px;width:29%;transform:rotate(-26deg)"></div><div class="edge" style="left:52%;top:202px;width:29%;transform:rotate(29deg);background:repeating-linear-gradient(90deg,#c5d6f1 0 5px,transparent 5px 10px)"></div>${[['Customer account','Starting access','○'],['Invoice request','Missing access check','⇄'],['Billing details exposed','Demonstrated sample','▧'],['Related invoice routes','Not established','?']].map(([t,s,i],n)=>`<button data-node="${n}" class="mapnode n${n} ${node===n?'selected':''}"><span class="circle">${i}</span><small>${s}</small><b>${t}</b></button>`).join('')}</div><span class="mapnote">Select a node to follow the finding</span></div><div class="map-legend"><span>Supported in the example</span><span>Further investigation</span></div></div><article class="insight"><span class="pill">${d[0]}</span><h2>${d[1]}</h2><p>${d[2]}</p><div class="insightfact"><small>${d[3]}</small><b>${d[4]}</b></div><button class="textlink" data-modal="${d[5]}">${node===1?'Open repair recommendation':'Inspect supporting detail'} ↗</button></article></div><div class="map-summary"><p><b>Significance:</b> Billing data crossed a company boundary. Wider reach is not established.</p><p><b>Also investigated:</b> Order approval after an edit remains an unconfirmed lead.</p></div><div class="map-bottom"><button data-modal="repair">What Synapse recommends <span>↗</span></button><button data-modal="scope">What remains untested <span>↗</span></button><button data-modal="evidence">Review the evidence <span>↗</span></button></div></section>`}
function story(){return `<div class="story"><nav class="storynav"><button data-scroll="finding">Finding</button><button data-scroll="impact">Consequence</button><button data-scroll="change">Recommendation</button><button data-scroll="limits">Open questions</button></nav><header class="story-intro" id="finding"><span class="pill">Invoice access · Customer data</span><h1>A customer’s login opened another company’s invoice.</h1><p>The application verified the account, but missed the ownership boundary. Here is the behavior we found—and the outcome we recommend.</p></header><section class="compare-stage"><div class="compare-labels"><span>Proposed repaired behavior</span><span>Current behavior</span></div><div class="wipe">${screen(1)}<div class="overlay">${screen(2)}</div><div class="divider"></div><input type="range" min="0" max="100" value="50" id="wipe" aria-label="Compare proposed repair and current behavior"></div><p class="wipehint">Drag the divider to compare · Illustrations, not repair evidence</p></section><div class="story-sections"><section class="story-section" id="impact"><h2>What this exposes</h2><div><p>This is significant because billing details crossed a company boundary. A valid customer account was enough; wider reach and payment modification were not demonstrated.</p><div class="facts"><div><b>2</b><small>Records demonstrated</small></div><div><b>?</b><small>Wider reach unresolved</small></div></div><button class="textlink" data-modal="evidence">Follow the evidence sequence ↗</button></div></section><section class="story-section" id="change"><h2>What should change</h2><div><p>Check the caller’s access to each invoice on the server. Use the same ownership and approved-sharing rule for details, downloads and exports.</p><div class="inlinechecks"><span>Block unrelated companies</span><span>Preserve owner access</span><span>Retest related routes</span></div><button class="textlink" data-modal="repair">Engineering recommendation ↗</button></div></section><section class="story-section" id="limits"><h2>What remains open</h2><div><p>Confirm the intended collaborator rules and investigate related invoice routes. Order approval after editing remains an unconfirmed lead. A changed application needs a fresh retest.</p><button class="textlink" data-modal="scope">Assessment scope and limitations ↗</button></div></section><div class="study-links"><button class="textlink" data-modal="about">About this report</button></div></div></div>`}
function modal(type){let content={scope:`<p>This fictional assessment sample covers customer invoice access and order approval using supplied accounts.</p><h3>What the sample establishes</h3><ul><li>Two invoice records illustrate disclosure across a company boundary.</li><li>Normal owner access provides a legitimate-use comparison.</li></ul><h3>What remains open</h3><ul><li>Invoice export and download routes</li><li>Approved collaboration and sharing rules</li><li>Order approval after an edit</li><li>Behavior after an actual repair</li></ul><p>Independent reproduction has not been established. These examples do not describe a production assessment.</p>`,repair:`${comparison()}<h3>Engineering recommendation</h3><p>Enforce the invoice access rule on the server, using trusted session identity. Apply it consistently across detail, download and export paths.</p><h3>Acceptance and retest</h3><div class="code">Owner → invoice available\nUnrelated company → no protected fields returned\nApproved collaborator → intended access preserved\nMissing session → denied\nDetail / download / export → same rule\n\nRetest original and related cases on the changed build.\nEngineering location requires source inspection.</div><h3>Uncertainty to resolve</h3><p>Confirm the legitimate sharing rules before implementation. Moderate effort is an illustrative estimate, not a quote.</p>`,evidence:`${screen(screenStep)}<div class="evidence-tabs">${['Owner access','Cross-company response','Proposed outcome'].map((s,n)=>`<button data-modal-screen="${n}" class="${screenStep===n?'active':''}">${s}</button>`).join('')}</div><h3>${screenStep===2?'Proposed outcome':'Observation context'}</h3><p>${screenStep===2?'The repaired outcome is illustrated for comparison. It has not been implemented or retested.':'Alex is a customer in North company. The example response returns invoice INV-S021 from South company. Billing details are present; a status code alone would not establish the consequence.'}</p><p>These screens are illustrative recreations. A real report would link retained captures to the exact identity, environment and observation.</p>`,about:`<p>This is a reader-facing interactive report concept. It presents the assessment’s scope, findings, consequences and recommendations. It has no investigation controls.</p><h3>Design references</h3><div class="refimages"><div><img src="/references/2/frame0.png" alt="Archived Split View visual comparison"><h3>Split View</h3><p>Private R2 reference: paired visual surfaces and focused comparison.</p></div><div><img src="/references/1/product.png" alt="Archived Maxim Kuznetsov interface"><h3>Maxim Kuznetsov</h3><p>Private R2 reference: restrained surfaces and grouped information.</p><a href="https://x.com/disarto_max/status/2103897094671020203" target="_blank" rel="noopener">Original source ↗</a></div></div><p style="margin-top:20px">All report cases and figures are fictional. No verified security finding, production effect or successful repair is claimed.</p>`};let titles={scope:'Scope and open questions',repair:'Repair recommendation',evidence:'Supporting evidence',about:'About this report'};let d=document.getElementById('dialog');d.innerHTML=`<div class="dialoghead"><h2>${titles[type]}</h2><button class="secondary" id="close">Close ×</button></div><div class="dialogbody">${content[type]}</div>`;if(!d.open)d.showModal();d.querySelector('#close').onclick=()=>d.close();d.querySelectorAll('[data-modal-screen]').forEach(b=>b.onclick=()=>{screenStep=+b.dataset.modalScreen;modal('evidence')});d.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal))}
function bind(){document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>modal(b.dataset.modal));document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{chapter=+b.dataset.chapter;render()});document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screenStep=+b.dataset.screen;render()});document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{node=+b.dataset.node;render()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'instant',block:'start'}));let next=document.getElementById('next'),prev=document.getElementById('prev'),action=document.getElementById('nextAction');if(next)next.onclick=()=>{chapter=Math.min(4,chapter+1);render()};if(prev)prev.onclick=()=>{chapter=Math.max(0,chapter-1);render()};if(action)action.onclick=()=>{chapter=(chapter+1)%5;render()};let wipe=document.getElementById('wipe');if(wipe)wipe.oninput=()=>{document.querySelector('.overlay').style.clipPath='inset(0 '+(100-wipe.value)+'% 0 0)';document.querySelector('.divider').style.left=wipe.value+'%'}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;history.replaceState(null,'','?report='+mode);render();scrollTo(0,0)});document.getElementById('dialog').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};document.addEventListener('keydown',e=>{if(document.getElementById('dialog').open||mode!=='brief')return;if(e.key==='ArrowRight'){chapter=Math.min(4,chapter+1);render()}if(e.key==='ArrowLeft'){chapter=Math.max(0,chapter-1);render()}});render();
</script></body></html>
