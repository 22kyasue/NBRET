</style></head><body><main id="root"></main><dialog id="dialog"></dialog><script>function screen(s=screenStep){return `<div class="screen"><div class="screenbar"><i></i><i></i><i></i><span>Northstar Portal / Invoices</span></div><div class="screencontent"><aside class="screenmenu"><b>Northstar</b><p>Overview</p><p>Orders</p><p class="sel">Invoices</p></aside><div class="invoice"><div class="who"><span>Invoice details</span><span>Alex · North</span></div><div class="paper"><div class="company ${s===1?'exposed':''}"><span>${s===0?'North company':s===1?'South company':'Access protected'}</span><span>${s===2?'Proposed':'Invoice'}</span></div><h3>${s===2?'This invoice isn’t available to your account':s===0?'INV-N014':'INV-S021'}</h3><div class="datarow"><span>${s===2?'Protected fields':'Billing contact'}</span><span>${s===2?'Not returned':'Accounts team'}</span></div><div class="datarow"><span>${s===2?'Your own invoices':'Total due'}</span><span>${s===2?'Still available':'$2,400.00'}</span></div></div></div></div><div class="screencaption"><span>${s===2?'Proposed outcome · not retest evidence':'Screen illustration · sample case'}</span><button data-modal="evidence">Details ↗</button></div></div>`}

cle></div><section class="more-details"><button data-open="repair"><span class="detail-symbol">⊞</span><div><b>Recommended repair</b><small>${issue?'Establish the rule and effect first':'Ownership check across all invoice routes'}</small></div><span>↗</span></button><button data-open="next"><span class="detail-symbol">↗</span><div><b>What to investigate next</b><small>${issue?'Approval and revision behavior':'Related routes and repair uncertainties'}</small></div><span>↗</span></button></section></section>`}
function nodeData(){if(issue===1)return [{label:'Workflow context',title:'The customer changes an order',text:'The question begins with an order that was approved before an edit. This is a hypothesis to examine, not a demonstrated failure.',factLabel:'Starting question',fact:'Does the edit invalidate approval?'},{label:'Underlying uncertainty',title:'Is approval tied to the current revision?',text:'The assessment has not established which order revision the previous approval authorizes.',factLabel:'Needed next',fact:'Intended rule and runtime evidence'},{label:'Potential consequence',title:'A changed order might proceed without fresh approval',text:'This consequence remains unconfirmed. No unauthorized order action has been demonstrated.',factLabel:'Evidence status',fact:'Not demonstrated'},{label:'Related cases',title:'Check legitimate and changed-order sequences',text:'Compare a normal approved order with an edited order and confirm that legitimate operations still work.',factLabel:'Purpose',fact:'Establish the effect before recommending a fix'}][node];return [{label:'Starting access',title:'An ordinary customer account',text:'Alex belongs to North company. The path does not require administrator access.',factLabel:'Access used',fact:'Supplied customer role'},{label:'Why it happens',title:'The invoice’s ownership is not checked',text:'The application accepts the login without checking whether the customer is allowed to access the requested invoice.',factLabel:'Boundary crossed',fact:'Customer account → another company’s data'},{label:'Observed consequence',title:'Another company’s billing details are returned',text:'The response exposes invoice information across a company boundary.',factLabel:'Demonstrated sample',fact:'2 invoice records'},{label:'Extent unresolved',title:'Other invoice routes remain an open question',text:'The demonstrated sample does not establish all-customer access. Download and export routes need separate checks.',factLabel:'Follow-up',fact: function link(type,title,sub){return `<button class="drill" data-open="${type}"><div><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div><span>↗</span></button>`}
function layerContent(type){let x=c(),d=nodeData();switch(type){case'node':return {title:d.title,body:`<span class="pill">${d.label}</span><p>${d.text}</p><div class="layer-fact"><small>${d.factLabel}</small><b>${d.fact}</b></div><h3>Explore the supporting detail</h3>${issue?link('question','What needs to be established','Expected rule, missing evidence and controls'):link('evidence','Follow the evidence','Owner access → cross-company response')+link('identity','Identity and environment','Who acted, which record and where')+link('comparison','Expected vs. observed','The business rule and actual behavior')}${link('repair','Repair recommendation','Immediate change, broader rule and tests')}`};case'evidence':return {title:'Evidence sequence',body:issue?'<p>No unauthorized effect has been demonstrated for this question.</p>'+link('question','What evidence is missing','Conditions needed for a conclusion'):`<p>Compare legitimate owner access with the response from another company.</p>${screen(screenStep)}<div class="evidence-tabs">${['Owner access','Other company'].map((s,n)=>`<button data-evidence-step="${n}" class="${screenStep===n?'active':''}">${s}</button>`).join('')}</div><p class="layer-caption">Illustrative reconstruction. A real report would show retained captures bound to the underlying observation.</p>${link('observation','Inspect the underlying observation','Identity, request, returned record and evidentiary limits')}${link('identity','Check identity and environment','Context bound to this example')}`};case'observation':return {title:'Underlying observation',body:`<p>The returned content, rather than the response status alone, establishes the disclosure in this example.</p><div class="code">Principal    Alex\nCompany      North\nRole         Customer\nRequested    Invoice INV-S021\nRecord owner South\nObserved     Billing contact and invoice total returned\nExpected     No unrelated company’s protected fields\n\nEnvironment  Fictional design sample\nCapture      Illustration, not retained assessment bytes</div>${link('fields','Inspect the exposed fields','What the response reveals—and what it does not')}${link('comparison','Compare with the expected rule','Authorized access boundary')}`};case'fields':return {title:'Exposed invoice fields',body:`<div class="field-row"><span>Invoice identifier</span><b>INV-S021</b></div><div class="field-row"><span>Owning company</span><b>South</b></div><div class="field-row"><span>Billing contact</span><b>Accounts team</b></div><div class="field-row"><span>Invoice total</span><b>$2,400.00</b></div><p>These are fictional example values. Payment modification, bulk access and financial loss were not demonstrated.</p>${link('significance','Understand the consequence','Significance and extent')}`};case'identity':return {title:'Identity and environment',body:`<div class="field-row"><span>Acting customer</span><b>Alex · North company</b></div><div class="field-row"><span>Role</span><b>Customer</b></div><div class="field-row"><span>Target company</span><b>South</b></div><div class="field-row"><span>Environment</span><b>Fictional sample</b></div><p>A real report must retain the account, environment version and observation context. Account labels and screenshots alone do not authenticate independent reproduction.</p>${link('comparison','Expected vs. observed','Interpret the behavior in context')}`};case'comparison':return {title:'Expected vs. observed',body:issue?'<p>The intended approval rule and actual revision behavior need to be established.</p>'+link('question','Open investigation question','What would settle it'):`<div class="compare-entry"><small>Expected rule</small><p>A customer can read an invoice only through an authorized ownership or sharing relationship.</p></div><div class="compare-entry"><small>Observed in the sample</small><p>Alex from North company receives South company’s invoice.</p></div><div class="compare-entry proposed"><small>Proposed repaired outcome</small><p>The request returns no protected fields while legitimate owner access remains available.</p></div>${link('evidence','See the visual evidence','Owner access and cross-company response')}${link('repair','Read the repair recommendation','How to enforce the rule')}`};case'repair':return {title:issue?'Before recommending a repair':'Recommended repair',body:issue?`<p>First establish the intended approval rule and demonstrate the actual effect. A specific repair is not justified by the current evidence.</p>${link('question','What to establish next','Rule, revision binding and legitimate controls')}`:`<h3>Check access to every invoice</h3><p>Enforce the ownership and approved-sharing rule on the server. Apply it to details, downloads and exports.</p><div class="layer-fact"><small>Estimated effort</small><b>Moderate · illustrative estimate</b></div>${comparison()}${link('engineering','Engineering handoff','Immediate change, broader rule and legitimate flows')}${link('checks','Acceptance and retest','What must pass before calling the repair effective')}`};case'engineering':return {title:'Engineering handoff',body:`<h3>Immediate change</h3><p>Use trusted session identity to check the caller’s authorized relationship to the requested invoice before returning any protected fields.</p><h3>Broader rule</h3><p>Enforce the same access rule across invoice detail, export and download paths.</p><h3>Preserve legitimate behavior</h3><p>Owners and approved collaborators must retain intended access. Confirm the collaboration policy before implementation.</p><p class="layer-caption">The precise code location requires source inspection.</p>${link('checks','Acceptance checks and retest','Original path, related paths and legitimate controls')}`};case'checks':return {title:'Acceptance checks and retest',body:`<div class="code">Owner access          Invoice remains available\nUnrelated company     No protected fields returned\nApproved collaborator Intended access preserved\nMissing session       Request denied\nDetail / download / export enforce the same rule</div><p>Run the original, related and legitimate cases against the changed build with matched identities and conditions.</p><div class="compare-entry proposed"><small>Repair status</small><p>Proposed only. No actual repaired build or retest evidence is supplied by this design sample.</p></div>${link('next','Resolve the remaining repair uncertainty','Collaborator rules and alternate routes')}`};case'next':return {title:'What to investigate next',body:issue?`<p>Establish whether editing an order invalidates its previous approval. Compare with a legitimate approval flow before making a consequence claim.</p>${link('question','Evidence needed','Expected rule, observed state and control')}`:`<h3>Extend the demonstrated path</h3><p>Check whether invoice export and download enforce the same ownership boundary, using a minimal sample and legitimate controls.</p><h3>Resolve the repair uncertainty</h3><p>Confirm which collaborators should legitimately receive shared invoices.</p>${link('checks','See the acceptance checks','Preserve legitimate operations')}`};case'question':return {title:'The approval question',body:`<p>Does editing an approved order require approval of the new revision?</p><h3>What is missing</h3><ul><li>The intended rule supplied by the business owner</li><li>The order and approval state before and after an edit</li><li>A legitimate unchanged-order comparison</li><li>Evidence of whether an action can proceed</li></ul><p>No unauthorized consequence, extent or repair has been established.</p>`};case'significance':return {title:'Why this matters',body:issue?`<p>The seriousness is not assessed because the effect is unconfirmed.</p>${link('question','What would establish the consequence','Missing rule and observations')}`:`<h3>Significant in this example</h3><p>Customer billing information crossed a company boundary using an ordinary customer account.</p><h3>Extent</h3><p>Two invoice records form the demonstrated sample. Wider reach is unresolved. Payment modification and a monetary loss amount were not established.</p>${link('evidence','Inspect the sample evidence','What was returned')}${link('next','What determines wider reach','Related routes and assumptions')}`};case'scope':return {title:'What we tested',body:`<div class="field-row"><span>Company</span><b>Northstar</b></div><div class="field-row"><span>Website</span><b>app.northstar.example</b></div><div class="field-row"><span>Access</span><b>Supplied customer accounts</b></div><h3>Examined</h3><ul><li>Customer access to invoice records</li><li>Legitimate owner access</li><li>Order approval and revision questions</li></ul><h3>Remaining limits</h3><p>Invoice export/download, collaboration rules and approval-after-edit behavior remain unresolved. No actual repair, independent verification, production assessment or calibrated loss estimate is represented.</p>`};case'map-explain':return {title:'Reading the consequence map',body:'<p>The map connects starting access, the underlying behavior and its consequence. Select a point to read its explanation, then inspect its supporting details.</p><p>Solid connections describe the supported example. Dashed connections remain questions. The approval issue is entirely unconfirmed.</p>'};default:return {title:'About this report',body:'<p>This prototype follows one report structure: company and website overview → issues → consequence map → evidence and engineering details.</p><p>All data and screens are fictional. In a delivered assessment, retained evidence and its limitations would replace these illustrations.</p>'}}}
function openLayer(type){layerStack.push({type,step:screenStep});renderLayer()}
function renderLayer(){let last=layerStack.at(-1),d=layerContent(last.type);let dialog=document.getElementById('dialog');dialog.innerHTML=`<header class="layer-head"><div>${layerStack.length>1?'<button id="layer-back">← Back</button>':'<small>Supporting detail</small>'}<button id="layer-close" aria-label="Close supporting details">×</button></div><div class="layer-trail">${issue===null?'Assessment':'Issue 0'+(issue+1)}<span>›</span>${layerStack.map(s=>layerContent(s.type).title).slice(-2).join(' › ')}</div><h2>${d.title}</h2></header><section class="layer-body">${d.body}</section>`;if(!dialog.open)dialog.showModal();dialog.querySelector('#layer-close').onclick=closeLayer;let back=dialog.querySelector('#layer-back');if(back)back.onclick=()=>{layerStack.pop();screenStep=layerStack.at(-1).step;renderLayer()};dialog.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLayer(b.dataset.open));dialog.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openLayer(b.dataset.modal==='evidence'?'observation':b.dataset.modal));dialog.querySelectorAll('[data-evidence-step]').forEach(b=>b.onclick=()=>{screenStep=+b.dataset.evidenceStep;last.step=screenStep;renderLayer()})}
function closeLayer(){document.getElementById('dialog').close();layerStack=[]}
function selectIssue(n){issue=n;node=2;screenStep=1;history.pushState({issue:n},'','?issue='+issues[n].id);render();scrollTo(0,0)}
function home(){issue=null;history.pushState({issue:null},'','/');render();scrollTo(0,0)}
function bind(){document.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>selectIssue(+b.dataset.issue));document.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{node=+b.dataset.node;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openLayer(b.dataset.open))}
document.getElementById('dialog').onclick=e=>{if(e.target===e.currentTarget)closeLayer()};document.getElementById('dialog').addEventListener('cancel',()=>{layerStack=[]});window.onpopstate=()=>{if(document.getElementById('dialog').open)closeLayer();let id=new URLSearchParams(location.search).get('issue');issue=issues.some(i=>i.id===id)?issues.findIndex(i=>i.id===id):null;render()};let start=new URLSearchParams(location.search).get('issue');if(start)issue=issues.some(i=>i.id===start)?issues.findIndex(i=>i.id===start):null;render();
</script></body></html>
