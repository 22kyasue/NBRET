<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synapse — three design directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#242823;font:15px/1.55 Arial,sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #c37c38;outline-offset:4px}button{color:inherit} .chooser{background:#202722;color:#fff;padding:15px 4%;display:flex;align-items:center;justify-content:space-between;gap:20px}.chooser small{color:#b9c5bc}.choices{display:flex;gap:6px}.choices button{border:1px solid #586059;background:transparent;color:#fff;padding:9px 16px;border-radius:6px}.choices button.active{background:#e5eddf;color:#202722;border-color:#e5eddf}.shell{max-width:1440px;margin:auto;min-height:92vh}.mast{display:flex;justify-content:space-between;align-items:center;padding:26px 5%;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.brand i{font-style:normal;color:var(--accent)}.mast span{font-size:12px;color:var(--muted)}.body{padding:44px 6% 60px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:700;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:49px;line-height:1.1;letter-spacing:-2px;margin:14px 0 18px;max-width:850px}h2{font-size:27px;line-height:1.25;letter-spacing:-.7px}h3{font-size:18px;line-height:1.4}.intro{color:var(--muted);max-width:660px}.top{display:flex;justify-content:space-between;gap:32px;align-items:end}.status{border:1px solid var(--line);padding:14px 20px;font-size:12px;min-width:190px}.status b{display:block;color:var(--accent);font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:32px 0}.summary>div{padding:18px 24px;border-right:1px solid var(--line)}.summary>div:first-child{padding-left:0}.summary strong{font-size:26px;margin-right:12px}.summary span{font-size:12px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-title small{color:var(--muted)}.cards{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);padding:28px;text-align:left;display:block;width:100%}.card:hover{border-color:var(--accent)}.label{display:inline-block;font-size:10px;font-weight:bold;letter-spacing:.5px;padding:4px 8px;background:var(--tint);color:var(--accent);border-radius:3px}.card h2{margin:18px 0 12px}.card p{color:var(--muted);font-size:14px}.facts{display:flex;gap:32px;border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.facts small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.facts b{font-size:13px;font-weight:500}.open{display:block;margin-top:24px;color:var(--accent);font-size:13px;font-weight:bold}.lower{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:30px}.lower h3{margin-bottom:8px}.lower p{font-size:13px;color:var(--muted)}.note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.back{border:0;background:none;padding:0;color:var(--accent);margin-bottom:26px}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:30px 0 24px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:12px 0;color:var(--muted)}.tabs button.active{color:var(--accent);border-color:var(--accent)}.detailgrid{display:grid;grid-template-columns:1.8fr 1fr;gap:30px}.textblock{background:var(--panel);padding:25px;border:1px solid var(--line)}.textblock p{margin-top:12px;color:var(--muted);font-size:14px}.stepbar{display:flex;gap:8px;margin:18px 0}.stepbar button{border:1px solid var(--line);padding:9px 14px;background:var(--panel)}.stepbar .active{border-color:var(--accent);color:var(--accent)}.capture{background:#e9eeeb;color:#263b33;border:1px solid #cad5cd;padding:20px;min-height:255px}.browserbar{border-bottom:1px solid #c6d0ca;color:#64756c;font-size:11px;padding-bottom:12px;margin-bottom:20px}.appnav{font-size:12px;display:flex;justify-content:space-between}.invoice{background:#fff;margin:20px auto 5px;padding:22px;max-width:390px;border:1px solid #c8d1ca;box-shadow:0 10px 25px #23392b0d}.invoice h3{margin:12px 0}.invoice dl{display:grid;grid-template-columns:1fr 1fr;font-size:12px}.invoice dd{margin:0;text-align:right}.highlight{outline:2px solid #ba5d3d;outline-offset:6px}.caption{font-size:11px;color:var(--muted);margin-top:10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:15px}.pair h3{margin:12px 0}.pair p{font-size:14px;color:var(--muted)}.code{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:24px;font:12px/1.8 Consolas,monospace}.rail{display:none}.editorial{--accent:#53664b;--muted:#72776d;--line:#d9dbd1;--panel:#fafbf7;--tint:#e8eddf}.editorial h1,.editorial .card h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-1.3px}.workspace{--accent:#a8cdb4;--muted:#99a7a2;--line:#34413c;--panel:#232f2a;--tint:#344c40;background:#19231f;color:#e7eee9;display:grid;grid-template-columns:190px 1fr}.workspace .rail{display:block;grid-row:1/4;border-right:1px solid var(--line);padding:32px 20px}.rail b{font-size:21px}.rail p{font-size:12px;color:var(--muted);margin:35px 0 10px}.rail div{padding:11px 10px;font-size:13px}.rail .selected{background:var(--tint);color:var(--accent);border-radius:5px}.workspace .body{padding:35px 4%}.workspace .mast{padding:23px 4%}.workspace h1{font-size:37px;letter-spacing:-1px}.workspace .card{border-radius:9px}.workspace .cards{grid-template-columns:1fr 1fr}.workspace .summary{background:var(--panel);border-radius:8px;border:1px solid var(--line)}.workspace .summary>div:first-child{padding-left:24px}.casebook{--accent:#285bc2;--muted:#718095;--line:#dde4ef;--panel:#fff;--tint:#e9f0fe;background:#f5f7fc;color:#202f47}.casebook .mast{background:#fff}.casebook h1{font-size:44px}.casebook .card{border-radius:16px;overflow:hidden;padding:0}.casebook .cardbody{padding:25px}.mini{display:none}.casebook .mini{display:flex;align-items:center;justify-content:center;gap:16px;background:#e4ebf8;height:115px;border-bottom:1px solid var(--line)}.mini span{background:white;padding:12px 16px;border:1px solid #c9d5ed;border-radius:7px;font-size:11px;box-shadow:0 5px 12px #23436508}.casebook .cards{grid-template-columns:1.3fr 1fr}.casebook .status{border-radius:10px;background:white}.casebook .summary{border:0;gap:15px}.casebook .summary>div{border:1px solid var(--line);background:white;border-radius:10px;padding:18px 24px}.casebook .textblock{border-radius:12px}.casebook .capture{border-radius:10px}.direction{font-size:12px;color:var(--muted);margin-bottom:28px}.empty{padding:28px;border:1px dashed var(--line);color:var(--muted)}@media(max-width:850px){.chooser{align-items:start;flex-direction:column}.choices{flex-wrap:wrap}.workspace{display:block}.workspace .rail{display:none}.top{display:block}.status{margin-top:20px}.cards,.workspace .cards,.casebook .cards,.detailgrid,.lower,.pair{grid-template-columns:1fr}h1{font-size:36px}.summary strong{display:block}.summary>div{padding:12px}.body{padding:30px 6%}.facts{gap:18px}.tabs{gap:15px;font-size:12px}.mast span{max-width:160px;text-align:right}}
</style>
<header class="chooser"><div><b>Choose a direction</b><br><small>Interactive UI studies · fictional examples, not assessment results</small></div><nav class="choices" aria-label="Design directions"><button data-theme="editorial">01 / Editorial</button><button data-theme="workspace">02 / Workspace</button><button data-theme="casebook">03 / Casebook</button></nav></header><div id="app"></div>
<script>
let theme=new URLSearchParams(location.search).get('design')||'editorial',view='overview',tab='story',step=0,issue=0;
const themes={editorial:['The considered report','Quiet, spacious and easy to read. A report you can explore.'],workspace:['The investigation workspace','Compact navigation and persistent context for repeated use.'],casebook:['The visual casebook','Evidence previews and approachable cards make each consequence tangible.']};
const issues=[{title:'Customer invoices can cross account boundaries',why:'The app checks that a customer is signed in, but does not check who owns the requested invoice.',impact:'Billing details from another organization become visible.',extent:'2 records demonstrated',potential:'Wider reach unresolved',effort:'Moderate',label:'Priority 01 · Needs your verification'},{title:'An edited order may retain an earlier approval',why:'The relationship between approval and the current order revision needs investigation.',impact:'A changed order could proceed without a fresh approval.',extent:'Not demonstrated',potential:'Workflow impact unknown',effort:'Not yet estimated',label:'Unconfirmed lead'}];
function render(){if(!themes[theme])theme='editorial';document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme));let i=issues[issue];document.getElementById('app').innerHTML=`<div class="shell ${theme}"><aside class="rail"><b>synapse<span style="color:var(--accent)">.</span></b><p>EXAMPLE ASSESSMENT</p><div class="selected">◈ &nbsp; Consequences</div><div>◎ &nbsp; Investigation</div><div>↗ &nbsp; Repairs & retests</div><p>RECORD</p><div>Evidence library</div><div>Scope & unknowns</div></aside><div><header class="mast"><div class="brand">synapse<i>.</i></div><span>Northstar Portal / Example assessment</span></header><main class="body"><div class="direction">0${Object.keys(themes).indexOf(theme)+1} — ${themes[theme][0]} &nbsp; / &nbsp; ${themes[theme][1]}</div>${view==='overview'?overview():detail(i)}<footer class="note">Design demonstration only. All cases, counts and screen recreations are fictional. No independently verified findings are claimed. Proposed outcomes remain separate from observed repair evidence.</footer></main></div></div>`;bind()}
function overview(){return `<div class="top"><div><div class="eyebrow">Assessment overview</div><h1>Understand the consequence.<br>Know what to do next.</h1><p class="intro">Start with what someone could do and why. Follow the evidence, understand the reach, then explore a practical repair.</p></div><div class="status"><b>Ready for your review</b>Illustrative report · 18 October</div></div><div class="summary"><div><strong>01</strong><span>Issue needing your action</span></div><div><strong>01</strong><span>Unconfirmed lead</span></div><div><strong>00</strong><span>Independently verified findings</span></div></div><div class="section-title"><h3>Consequences to understand</h3><small>Ordered by impact and supported reach</small></div><div class="cards">${issues.map((i,n)=>`<button class="card" data-open="${n}"><div class="mini"><span>${n?'Order edited':'Customer account'}</span>→<span>${n?'Approval unchanged?':'Another company’s invoice'}</span></div><div class="cardbody"><span class="label">${i.label}</span><h2>${i.title}</h2><p><b>Why:</b> ${i.why}</p><div class="facts"><div><small>Reach</small><b>${i.extent}</b></div><div><small>Repair effort</small><b>${i.effort}</b></div></div><span class="open">${n?'Explore the open question':'Follow the evidence'} &nbsp; ↗</span></div></button>`).join('')}</div><div class="lower"><div><div class="eyebrow">Recommended next investigation</div><h3>Establish the extent of invoice access</h3><p>Check whether the same ownership gap applies to other invoice routes, using a minimal sample and legitimate-owner controls.</p></div><div><div class="eyebrow">Repair uncertainty</div><h3>Preserve access for legitimate collaborators</h3><p>Confirm intended shared access before choosing the ownership rule. The repair must block cross-company access while preserving approved collaboration.</p></div></div>`}
function detail(i){return `<button class="back" id="back">← All consequences</button><div class="eyebrow">${i.label}</div><h1>${i.title}</h1><p class="intro">${i.impact} ${i.why}</p><nav class="tabs" aria-label="Issue detail">${[['story','Visual walkthrough'],['repair','Proposed repair'],['technical','Engineering detail']].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')}</nav>${issue===1?`<div class="empty"><h3>This is an open question.</h3><p>No unauthorized effect has been demonstrated. Next: compare the approved revision with the edited order, then check a valid approval flow. No screenshot or repair evidence is invented for this lead.</p></div>`:tab==='story'?story():tab==='repair'?repair():technical()}`}
function story(){let names=['Starting access','Observed exposure','Possible further reach'];return `<div class="detailgrid"><section><div class="eyebrow">Evidence sequence</div><div class="stepbar">${names.map((n,k)=>`<button data-step="${k}" class="${step===k?'active':''}">0${k+1} / ${n}</button>`).join('')}</div><div class="capture"><div class="browserbar">● ● ● &nbsp; &nbsp; Fictional application screen · illustrative recreation</div><div class="appnav"><b>NORTHSTAR / BILLING</b><span>Signed in: Alex · North company</span></div><div class="invoice"><small>${step===0?'YOUR ORGANIZATION':step===1?'RECORD FROM ANOTHER ORGANIZATION':'REACH REQUIRES FURTHER EVIDENCE'}</small><h3>${step===0?'North company invoice':step===1?'South company invoice':'Other invoice routes?'}</h3><dl class="${step===1?'highlight':''}"><dt>Invoice</dt><dd>${step===0?'INV-N014':step===1?'INV-S021':'Not collected'}</dd><dt>Billing details</dt><dd>${step===2?'Unknown':'Visible in response'}</dd><dt>Organization</dt><dd>${step===0?'North':step===1?'South':'Not established'}</dd></dl></div></div><p class="caption">Illustration placeholder for a future bound screenshot artifact; this is not a captured assessment screen.</p></section><aside class="textblock"><span class="label">${step===2?'Unconfirmed extension':'Illustrative observed step'}</span><h3 style="margin-top:18px">${['Begin as an ordinary customer','An invoice crosses the company boundary','How far does the same gap reach?'][step]}</h3><p>${['The legitimate invoice establishes that the account and normal billing flow work. No administrator access is assumed.','The same customer receives another company’s billing record. This is the concrete exposure the example describes.','Two sample records alone do not establish all-customer exposure. Check route consistency and authorization behavior before estimating wider reach.'][step]}</p><div class="facts"><div><small>Starting access</small><b>Customer account</b></div><div><small>Extent</small><b>${step===2?'Unresolved':'2 example records'}</b></div></div><p><b>Business consequence</b><br>Customer billing information could be disclosed across organizations. Payment changes have not been demonstrated.</p></aside></div>`}
function repair(){return `<div class="pair"><section class="textblock"><span class="label">Current behavior · example</span><h3>A valid login is enough to retrieve the invoice</h3><p>The requested record is returned without checking the customer’s relationship to its organization.</p><div class="code">Signed-in customer → requested invoice → returned</div></section><section class="textblock"><span class="label">Synapse proposal · not yet retested</span><h3>Check access to this invoice before returning it</h3><p>Enforce the organization and any approved sharing rules on the server for every invoice access path.</p><div class="code">Customer + invoice access check → allow or deny</div></section></div><div class="lower"><div><h3>Engineering handoff</h3><p>Centralize invoice authorization and apply it to detail, download and export routes. Derive the caller’s organization from trusted session state. Confirm collaboration requirements first.</p></div><div><h3>What would establish a working repair?</h3><p>Cross-company access is denied without returning protected data; owners and approved collaborators retain access. Repeat the original and related checks against the changed build.</p></div></div>`}
function technical(){return `<div class="detailgrid"><section><div class="eyebrow">Implementation & acceptance</div><h2 style="margin:12px 0">Enforce the invoice access rule at every entry point.</h2><div class="code">Rule: a caller may read an invoice only with an authorized\nrelationship to the owning organization.\n\nAcceptance checks\n01  Owner can retrieve the invoice.\n02  Another organization receives no protected fields.\n03  Approved collaborator retains intended access.\n04  Download and export enforce the same rule.\n05  Missing or expired session is rejected.\n\nRetest: changed build + matched identities + fresh evidence.\nEngineering location: to be established by source inspection.</div></section><aside class="textblock"><h3>Evidence & limits</h3><p>Principal: Alex / North / customer<br>Environment: fictional mockup<br>Sample: two illustrative records<br>Wider population: not established</p><p>No production effect, calibrated loss estimate or independently reproduced finding is represented here.</p><details><summary>Artifact structure</summary><p>Each future screenshot should reference its observation, actor, environment, capture time and redaction state. Existing normalized response evidence remains available.</p></details></aside></div>`}
function bind(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{issue=+b.dataset.open;view='detail';tab='story';step=0;render();scrollTo(0,0)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=+b.dataset.step;render()});let back=document.getElementById('back');if(back)back.onclick=()=>{view='overview';render()}}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;history.replaceState(null,'','?design='+theme);render()});render();
</script></html>
